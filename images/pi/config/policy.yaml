# OpenShell sandbox policy for the pi-openshell image.
# Trimmed from NVIDIA/OpenShell-Community sandboxes/pi/policy.yaml
# (commit edb65583a32c9ebb0fe8b6c709949e19ece08e52): Anthropic + GitHub only.
# Copied to /etc/openshell/policy.yaml. A policy passed at `openshell sandbox
# create --policy` takes precedence. NOT yet validated against gateway 0.1.7.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  pi:
    name: pi
    endpoints:
      # Anthropic API (API key or Claude subscription OAuth token)
      - { host: api.anthropic.com, port: 443 }
      # Claude OAuth token refresh (pi-claude-auth POSTs https://claude.ai/v1/oauth/token;
      # pi's built-in anthropic OAuth uses platform.claude.com)
      - { host: claude.ai, port: 443 }
      - { host: platform.claude.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/pi }
      - { path: /usr/local/bin/node }
      - { path: /usr/local/lib/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js }

  github_git:
    name: github-git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**/info/refs*" }
          - allow: { method: POST, path: "/**/git-upload-pack" }
          # Uncomment to allow push:
          # - allow: { method: POST, path: "/**/git-receive-pack" }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-https }

  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/gh }
